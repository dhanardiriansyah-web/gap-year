
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Kelas - mtkbarengkakdhanar</title>
  <!-- Tailwind CSS CDN -->

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

    .fade-in {
      animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }

</head>
<body class="bg-gradient-to-br from-slate-50 via-indigo-50/25 to-slate-100 text-slate-800 min-h-screen flex flex-col justify-between antialiased">

  <!-- Header & Konten Utama -->
  <main class="w-full max-w-2xl mx-auto px-4 py-8 md:py-12 flex-grow flex flex-col items-center">
    
    <!-- Branding Header -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-indigo-100 text-indigo-800 text-xs font-bold uppercase tracking-wider mb-3 shadow-sm">
        <span class="inline-block w-2 h-2 rounded-full bg-indigo-600 animate-pulse"></span>
        <span>Kelas Gap Year (Senin &amp; Kamis)</span>
      </div>
      <h1 class="text-2xl md:text-3xl font-extrabold text-slate-900 tracking-tight">Portal Materi &amp; Jadwal Belajar</h1>
      <p class="text-sm md:text-base text-slate-500 mt-1">Pilih tanggal atau tampilkan seluruh agenda modul dan link Google Meet</p>
    </div>

    <!-- Card Formulir Pencarian -->
    <div class="w-full bg-white rounded-2xl shadow-xl shadow-slate-200/70 border border-slate-200/90 p-6 md:p-8 backdrop-blur-sm">
      <form id="searchForm" class="space-y-4" onsubmit="event.preventDefault(); cariJadwal();">
        <div>
          <label for="inputTanggal" class="block text-sm font-semibold text-slate-700 mb-2">
            Pilih Tanggal Belajar:
          </label>
          <div class="relative">
            <input 
              type="date" 
              id="inputTanggal" 
              class="w-full px-4 py-3 bg-slate-50 border border-slate-300 rounded-xl text-slate-800 font-medium focus:ring-2 focus:ring-indigo-600 focus:border-indigo-600 outline-none transition duration-150"
            >
          </div>
        </div>

        <div class="flex flex-col sm:flex-row gap-3 pt-1">
          <button 
            type="submit" 
            id="btnCari"
            class="flex-1 bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99] text-white font-semibold py-3 px-6 rounded-xl transition duration-150 shadow-md shadow-indigo-200 flex items-center justify-center gap-2 text-sm"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
            <span>Cari Berdasarkan Tanggal</span>
          </button>
          
          <button 
            type="button" 
            id="btnLihatSemua"
            onclick="tampilkanSemuaJadwal()"
            class="bg-slate-100 hover:bg-slate-200 active:scale-[0.99] text-slate-700 font-semibold py-3 px-5 rounded-xl transition duration-150 text-sm flex items-center justify-center gap-1.5 border border-slate-200"
          >
            <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path>
            </svg>
            <span>Lihat Semua</span>
          </button>
        </div>
      </form>

      <!-- Wadah Hasil Pencarian -->
      <div id="resultContainer" class="mt-7 border-t border-slate-100 pt-6">
        <div id="initialState" class="text-center py-6 text-slate-400 text-sm">
          Pilih tanggal di atas atau klik <strong class="text-slate-600">"Lihat Semua"</strong> untuk memuat agenda kelas.
        </div>
      </div>
    </div>
  </main>

  <!-- Footer Custom mtkbarengkakdhanar -->
  <footer class="w-full py-4 md:py-6 text-center text-xs text-slate-600 border-t border-slate-200/60 bg-white/80 backdrop-blur-sm mt-8">
    <div class="max-w-4xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-center gap-3 sm:gap-6">
      <div class="flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 225" class="h-6 md:h-7 w-auto text-indigo-900 shrink-0" fill="none">
          <rect x="16" y="16" width="168" height="168" rx="32" fill="none" stroke="currentColor" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
          <line x1="100" y1="16" x2="100" y2="184" stroke="currentColor" stroke-width="12"/>
          <line x1="16" y1="100" x2="184" y2="100" stroke="currentColor" stroke-width="12"/>
          <line x1="58" y1="38" x2="58" y2="78" stroke="currentColor" stroke-width="11" stroke-linecap="round"/>
          <line x1="38" y1="58" x2="78" y2="58" stroke="currentColor" stroke-width="11" stroke-linecap="round"/>
          <line x1="122" y1="58" x2="162" y2="58" stroke="currentColor" stroke-width="11" stroke-linecap="round"/>
          <line x1="44" y1="128" x2="72" y2="156" stroke="currentColor" stroke-width="11" stroke-linecap="round"/>
          <line x1="72" y1="128" x2="44" y2="156" stroke="currentColor" stroke-width="11" stroke-linecap="round"/>
          <line x1="122" y1="142" x2="162" y2="142" stroke="currentColor" stroke-width="11" stroke-linecap="round"/>
          <circle cx="142" cy="124" r="6.5" fill="currentColor"/>
          <circle cx="142" cy="160" r="6.5" fill="currentColor"/>
          <text x="100" y="212" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="17" fill="currentColor" letter-spacing="-0.4">mtkbarengkakdhanar</text>
        </svg>
        <span class="font-bold text-slate-800">&copy; Dhanardi Riansyah</span>
        <span>&bull;</span>
        <span class="font-medium text-slate-500">All Rights Reserved</span>
      </div>
      <a href="https://wa.me/6281381374712" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 font-bold text-slate-700 hover:text-emerald-700 transition bg-emerald-50/80 hover:bg-emerald-100 px-3 py-1 rounded-full border border-emerald-200/80 text-xs shadow-sm">
        <svg class="w-3.5 h-3.5 text-emerald-600 fill-current shrink-0" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.205 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.947-1.48-2.116-1.653-2.414-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>
        <span>0813-813-747-12</span>
      </a>
    </div>
  </footer>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzQTGcw6EOzOUBqf3_LiFdVHl9B6DXR-KYC7kwBPGwya382zF0vh-1X7cDWBSBYETW8/exec";

    function formatTanggalIndo(dateStr) {
      if (!dateStr) return "";
      const parts = dateStr.split("-");
      if (parts.length === 3) {
        const year = parseInt(parts[0], 10);
        const monthIndex = parseInt(parts[1], 10) - 1;
        const day = parseInt(parts[2], 10);
        const dateObj = new Date(year, monthIndex, day);
        return dateObj.toLocaleDateString("id-ID", {
          day: "numeric",
          month: "long",
          year: "numeric"
        });
      }
      return dateStr;
    }

    function renderClickableItem(text, linkUrl, fallbackText) {
      if (!text || text.trim() === "" || text === "-") {
        return `<span class="text-slate-400 italic">${fallbackText}</span>`;
      }

      let targetUrl = linkUrl ? String(linkUrl).trim() : "";

      if (!targetUrl) {
        const urlMatch = text.match(/(https?:\/\/[^\s]+|drive\.google\.com[^\s]*|docs\.google\.com[^\s]*)/i);
        if (urlMatch) {
          targetUrl = urlMatch[0];
        }
      }

      if (targetUrl) {
        if (!targetUrl.startsWith("http://") && !targetUrl.startsWith("https://")) {
          targetUrl = `https://${targetUrl}`;
        }
        return `
          <a 
            href="${targetUrl}" 
            target="_blank" 
            rel="noopener noreferrer" 
            class="group inline-flex items-center gap-1.5 font-semibold text-indigo-600 hover:text-indigo-800 transition-colors underline decoration-indigo-300 hover:decoration-indigo-600 underline-offset-2 break-all"
            title="Klik untuk membuka tautan"
          >
            <span>${text}</span>
            <svg class="w-3.5 h-3.5 text-indigo-500 group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-transform shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
            </svg>
          </a>
        `;
      }

      return `<span class="font-medium text-slate-800">${text}</span>`;
    }

    async function fetchData(tanggal = "") {
      const resultContainer = document.getElementById("resultContainer");
      
      resultContainer.innerHTML = `
        <div class="flex flex-col items-center justify-center py-10 space-y-3">
          <div class="w-8 h-8 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin"></div>
          <p class="text-sm font-medium text-slate-500">Menghubungkan ke database Google Sheet...</p>
        </div>
      `;

      try {
        const endpoint = tanggal 
          ? `${SCRIPT_URL}?tanggal=${encodeURIComponent(tanggal)}` 
          : SCRIPT_URL;

        const res = await fetch(endpoint, {
          method: "GET",
          redirect: "follow"
        });

        if (!res.ok) {
          throw new Error(`HTTP Error: ${res.status}`);
        }

        const data = await res.json();

        if (data && data.error) {
          throw new Error(data.error);
        }

        renderJadwal(data, tanggal);
      } catch (err) {
        console.error("Fetch Error:", err);
        resultContainer.innerHTML = `
          <div class="p-4 bg-rose-50 border border-rose-200 rounded-xl text-rose-700 text-sm text-center">
            <p class="font-semibold mb-1">Gagal memuat jadwal kelas.</p>
            <p class="text-xs text-rose-600">Pastikan izin deployment di Google Apps Script telah diset ke <b>"Anyone"</b> dan coba beberapa saat lagi.</p>
          </div>
        `;
      }
    }

    function renderJadwal(data, filterTanggal = "") {
      const resultContainer = document.getElementById("resultContainer");

      if (!data || !Array.isArray(data) || data.length === 0) {
        resultContainer.innerHTML = `
          <div class="text-center py-8 fade-in">
            <div class="w-12 h-12 bg-slate-100 text-slate-400 rounded-full flex items-center justify-center mx-auto mb-3">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
              </svg>
            </div>
            <h4 class="text-base font-bold text-slate-700">Tidak ada agenda kelas</h4>
            <p class="text-xs text-slate-500 mt-1">
              ${filterTanggal ? `Tidak ditemukan sesi pada tanggal <b>${formatTanggalIndo(filterTanggal)}</b>.` : "Belum ada jadwal yang tercatat di spreadsheet."}
            </p>
          </div>
        `;
        return;
      }

      let cardsHtml = `
        <div class="space-y-4 fade-in">
          <div class="flex items-center justify-between text-xs font-semibold text-slate-500 pb-1">
            <span>Ditemukan ${data.length} sesi pembelajaran</span>
            ${filterTanggal ? `<span class="bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded">${formatTanggalIndo(filterTanggal)}</span>` : ''}
          </div>
      `;

      data.forEach(item => {
        const fields = item._data || {};
        
        const getField = (keyword) => {
          const key = Object.keys(fields).find(k => k.toLowerCase().includes(keyword.toLowerCase()));
          return key ? fields[key] : null;
        };

        const hariData = getField("hari");
        const tanggalData = getField("tanggal");
        const jamData = getField("jam") || getField("waktu");
        const meetData = getField("meet") || getField("link");

        const hariText = hariData ? hariData.text : (item.hari || "-");
        const tglText = tanggalData ? formatTanggalIndo(tanggalData.text) : (item.tanggal ? formatTanggalIndo(item.tanggal) : "");
        const jamText = jamData ? jamData.text : (item.jam || "-");
        let meetUrl = meetData ? (meetData.link || meetData.text) : (item.link || "");

        if (meetUrl && !meetUrl.startsWith("http://") && !meetUrl.startsWith("https://")) {
          meetUrl = `https://${meetUrl}`;
        }

        const excludedKeywords = ["hari", "tanggal", "jam", "waktu", "link meet", "google meet", "link"];
        let dynamicFieldsHtml = "";

        if (item._data && Object.keys(item._data).length > 0) {
          dynamicFieldsHtml = Object.keys(fields).map(header => {
            const isExcluded = excludedKeywords.some(ex => header.toLowerCase().includes(ex));
            if (isExcluded) return "";

            const col = fields[header];
            if (!col || !col.text || col.text === "-") return "";

            const contentHtml = renderClickableItem(col.text, col.link, "-");

            return `
              <div class="flex items-start gap-2.5">
                <div class="p-1.5 bg-indigo-50 text-indigo-700 rounded-lg mt-0.5 shrink-0">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                  </svg>
                </div>
                <div class="flex-grow">
                  <span class="text-xs font-bold text-slate-400 uppercase tracking-wider block">${header}</span>
                  <div class="mt-0.5">${contentHtml}</div>
                </div>
              </div>
            `;
          }).filter(Boolean).join("");
        } else {
          const materiHtml = renderClickableItem(item.materi, item.materi_link || item.link_materi, "Belum ada keterangan materi");
          const latihanHtml = renderClickableItem(item.latihan, item.latihan_link || item.link_latihan, "-");
          const hasLatihan = item.latihan && item.latihan !== "-" && item.latihan.trim() !== "";

          dynamicFieldsHtml = `
            <div class="flex items-start gap-2.5">
              <div class="p-1.5 bg-amber-100 text-amber-800 rounded-lg mt-0.5 shrink-0">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
                </svg>
              </div>
              <div class="flex-grow">
                <span class="text-xs font-bold text-slate-400 uppercase tracking-wider block">Materi Kelas</span>
                <div class="mt-0.5">${materiHtml}</div>
              </div>
            </div>
            ${hasLatihan ? `
              <div class="flex items-start gap-2.5">
                <div class="p-1.5 bg-emerald-100 text-emerald-800 rounded-lg mt-0.5 shrink-0">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                  </svg>
                </div>
                <div class="flex-grow">
                  <span class="text-xs font-bold text-slate-400 uppercase tracking-wider block">Latihan di Rumah</span>
                  <div class="mt-0.5">${latihanHtml}</div>
                </div>
              </div>
            ` : ''}
          `;
        }

        cardsHtml += `
          <div class="bg-slate-50/90 hover:bg-slate-100/90 border border-slate-200 rounded-xl p-5 transition duration-150 shadow-sm">
            
            <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-200/80 pb-3 mb-3.5">
              <div>
                <span class="inline-block font-extrabold text-indigo-950 text-lg tracking-tight">${hariText}</span>
                <span class="text-xs text-slate-500 ml-1.5 font-medium">${tglText}</span>
              </div>
              <span class="inline-flex items-center gap-1.5 text-xs font-semibold px-2.5 py-1 rounded-md bg-indigo-100 text-indigo-800">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                ${jamText} WIB
              </span>
            </div>

            <div class="space-y-2.5 text-sm mb-4">
              ${dynamicFieldsHtml || '<p class="text-xs text-slate-400 italic">Tidak ada detail materi</p>'}
            </div>

            <div>
              ${meetUrl ? `
                <a 
                  href="${meetUrl}" 
                  target="_blank" 
                  rel="noopener noreferrer" 
                  class="w-full inline-flex items-center justify-center gap-2 bg-emerald-600 hover:bg-emerald-700 active:scale-[0.99] text-white font-semibold py-2.5 px-4 rounded-xl text-xs transition duration-150 shadow-sm"
                >
                  <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-9l6 4.5-6 4.5z"/>
                  </svg>
                  <span>Masuk ke Google Meet</span>
                </a>
              ` : `
                <span class="w-full inline-flex items-center justify-center py-2 px-3 text-xs text-slate-400 bg-slate-100 rounded-xl font-medium">
                  Link Google Meet belum tersedia
                </span>
              `}
            </div>

          </div>
        `;
      });

      cardsHtml += `</div>`;
      resultContainer.innerHTML = cardsHtml;
    }

    function cariJadwal() {
      const tanggalInput = document.getElementById("inputTanggal").value;
      if (!tanggalInput) {
        const resultContainer = document.getElementById("resultContainer");
        resultContainer.innerHTML = `
          <div class="p-3 bg-amber-50 border border-amber-200 rounded-xl text-amber-800 text-xs text-center font-medium">
            ⚠️ Silakan tentukan tanggal belajar terlebih dahulu pada kolom di atas.
          </div>
        `;
        return;
      }
      fetchData(tanggalInput);
    }

    function tampilkanSemuaJadwal() {
      document.getElementById("inputTanggal").value = "";
      fetchData("");
    }
  </script>
</body>
</html>
